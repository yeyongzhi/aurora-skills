name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次部署，排队而不是互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: 校验 skill 元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/lint-skills.py

  build:
    name: 生成站点数据
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 扫描仓库并生成 site/data/skills.js
        run: python scripts/build-site.py
      # enabled: true 会在首次运行时自动为仓库开启 Pages，
      # 否则仓库从未配置过 Pages 时这里会报 "Get Pages site failed: Not Found"
      - name: 启用 Pages 并写入站点元数据
        uses: actions/configure-pages@v5
        with:
          enabled: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
