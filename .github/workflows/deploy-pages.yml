name: Validate and deploy GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 校验 Skill 与站点数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/lint-skills.py --strict
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build-site.py --check
      - run: python -m py_compile scripts/build-site.py scripts/lint-skills.py scripts/skill_utils.py
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --check site/app.js
      - run: node --check site/data/skills.js

  build:
    name: 生成站点产物
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build-site.py
      - uses: actions/configure-pages@v5
        with:
          enabled: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 部署
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
